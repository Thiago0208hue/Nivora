<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Nivora</a>

      <a href="dashboard.html">Dashboard</a>

    <div class="header-actions">
      <button id="themeToggle" class="icon-btn" aria-label="Alternar tema claro/escuro">🌙</button>
    </div>
  </div>
</header>

<main class="container page" id="treinarApp">
  <h1 class="section-title">Treinar</h1>

  <div class="filtros" id="filtros">
    <select id="filtroArea">
      <option value="">Todas as áreas</option>
      <option value="matematica">Matemática</option>
      <option value="natureza">Ciências da Natureza</option>
      <option value="linguagens">Linguagens</option>
      <option value="humanas">Ciências Humanas</option>
    </select>
    <select id="filtroMateria">
      <option value="">Todas as matérias</option>
    </select>
    <select id="filtroAssunto">
      <option value="">Todos os assuntos</option>
    </select>
    <select id="filtroDificuldade">
      <option value="">Qualquer dificuldade</option>
      <option value="Fácil">Fácil</option>
      <option value="Médio">Médio</option>
      <option value="Difícil">Difícil</option>
    </select>
    <select id="filtroAno" style="display:none">
      <option value="">Qualquer ano</option>
    </select>
    <select id="filtroQuantidade">
      <option value="5">5 questões</option>
      <option value="10">10 questões</option>
      <option value="999">Todas</option>
    </select>
    <button class="btn btn-primary" id="btnComecar">Começar</button>
  </div>

  <div id="quizArea"></div>
</main>
